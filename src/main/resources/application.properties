spring.application.name=ProjectJavaWebApplicationPhamCongThanh

# Database Connection (Port 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/smart_academic_&_lab_support_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Data Seeding
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.thymeleaf.cache=false

# Web Logging Configuration
logging.level.org.springframework.web=DEBUG
