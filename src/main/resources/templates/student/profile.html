<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học bạ cá nhân - Smart Academic & Lab Support</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --dark: #0f172a;
            --light-bg: #f8fafc;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --glow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--light-bg);
            color: var(--dark);
        }

        .navbar-custom {
            background: rgba(255, 255, 255, 0.85);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand-custom {
            font-weight: 700;
            font-size: 1.4rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link-custom {
            font-weight: 500;
            color: #64748b !important;
            margin: 0 0.5rem;
            padding: 0.5rem 1rem !important;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .nav-link-custom:hover, .nav-link-custom.active {
            color: var(--primary) !important;
            background: rgba(79, 70, 229, 0.08);
        }

        .profile-card {
            background: #fff;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 0, 0, 0.05);
            padding: 3rem;
            margin-top: 3rem;
            margin-bottom: 3rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            overflow: hidden;
        }

        .profile-header {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 2rem;
            margin-bottom: 2rem;
        }

        .avatar-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            margin-right: 1.5rem;
            box-shadow: var(--glow);
        }

        .profile-info h2 {
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .stat-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            height: 100%;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-2px);
            box-shadow: var(--card-shadow);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .stat-value {
            font-size: 2.25rem;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            color: #64748b;
            font-weight: 500;
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        .btn-logout-custom {
            border-radius: 8px;
        }

        .card-info-custom {
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand navbar-brand-custom" href="/dashboard">
                <i class="fa-solid fa-graduation-cap me-2"></i>Smart Platform
            </a>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom" href="/dashboard"><i class="fa-solid fa-house me-1"></i> Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom" href="/student/mentoring"><i class="fa-solid fa-calendar-check me-1"></i> Đặt lịch hẹn</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom" href="/student/borrow"><i class="fa-solid fa-toolbox me-1"></i> Mượn thiết bị</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom active" href="/student/profile"><i class="fa-solid fa-id-card me-1"></i> Học bạ cá nhân</a>
                    </li>
                    <li class="nav-item ms-3">
                        <a class="btn btn-outline-danger btn-sm px-3 btn-logout-custom" href="/logout">
                            <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar-circle">
                    <span th:text="${#strings.substring(profile.studentName != null ? profile.studentName : 'U', 0, 1).toUpperCase()}">S</span>
                </div>
                <div class="profile-info">
                    <h2 th:text="${profile.studentName != null ? profile.studentName : 'Chưa có họ tên'}">Tên sinh viên</h2>
                    <p class="text-muted mb-0"><i class="fa-solid fa-building-columns me-1"></i> Khoa/Ngành: <strong th:text="${profile.departmentName != null ? profile.departmentName : 'Chưa cập nhật'}">Khoa CNTT</strong></p>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="row g-4 mb-4">
                <!-- Số buổi mentoring hoàn thành -->
                <div class="col-md-6">
                    <div class="stat-box">
                        <div class="stat-value" th:text="${profile.totalCompletedSessions}">0</div>
                        <div class="stat-label">Buổi Mentoring Hoàn Thành</div>
                    </div>
                </div>

                <!-- Điểm số GPA trung bình -->
                <div class="col-md-6">
                    <div class="stat-box">
                        <div class="stat-value" th:text="${profile.averageScore != null ? #numbers.formatDecimal(profile.averageScore, 1, 2) : 'Chưa có'}">0.0</div>
                        <div class="stat-label">Điểm Trung Bình (GPA)</div>
                    </div>
                </div>
            </div>

            <!-- Personal details -->
            <div class="card bg-light border-0 p-4 card-info-custom">
                <h5 class="fw-bold mb-3"><i class="fa-solid fa-user-tag me-2 text-primary"></i> Thông tin liên hệ</h5>
                <div class="row g-3">
                    <div class="col-sm-6">
                        <span class="text-muted">Số điện thoại:</span>
                        <div class="fw-semibold mt-1" th:text="${profile.phone != null && profile.phone != '' ? profile.phone : 'Chưa có'}">Chưa cập nhật</div>
                    </div>
                    <div class="col-sm-6">
                        <span class="text-muted">Vai trò tài khoản:</span>
                        <div class="fw-semibold mt-1 text-primary">SINH VIÊN (STUDENT)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
