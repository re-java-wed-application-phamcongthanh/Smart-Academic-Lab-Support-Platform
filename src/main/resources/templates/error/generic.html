<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Có lỗi xảy ra - Smart Academic & Lab Support</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .error-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 550px;
            width: 100%;
            padding: 3rem;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .error-icon {
            font-size: 4.5rem;
            color: #ef4444;
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .error-title {
            font-weight: 700;
            font-size: 1.75rem;
            margin-bottom: 1rem;
            color: #1e293b;
        }

        .error-msg {
            color: #64748b;
            font-size: 1.05rem;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: left;
            word-break: break-word;
        }

        .btn-home {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-home:hover {
            color: #fff;
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3);
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="error-icon">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h1 class="error-title">Rất tiếc! Đã xảy ra lỗi</h1>
        
        <div class="error-msg">
            <i class="fa-solid fa-circle-info me-1"></i> <span th:text="${errorMessage}">Chi tiết thông báo lỗi hiển thị ở đây.</span>
        </div>

        <a href="/dashboard" class="btn-home">
            <i class="fa-solid fa-house-chimney me-2"></i> Quay lại Dashboard
        </a>
    </div>

</body>
</html>
